<!doctype html><html lang="en"><head><meta charset="utf-8"><title>HudGlance — Wow Together mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#d9b45b}a:hover{color:#f0d17e}
</style>
<style>body{background:#111;padding:24px}</style></head><body>

<div style="width: 460px; height: 190px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #e8e2d3; background: #1f1c17; border: 1px solid #4a4133; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: #272319; border-bottom: 1px solid #3b3429">
    <div style="flex: 1; font-size: 12px; color: #b8ae9c">Horde / The Barrens · <span style="color: #e8e2d3; font-weight: 600">12/48</span> · <span style="color: #d9b45b">Glance</span></div>
    <button type="button" aria-label="Pause" style="width: 28px; height: 28px; border: 1px solid #4a4133; background: #1f1c17; color: #e8e2d3; border-radius: 4px; font-size: 13px">II</button>
    <button type="button" aria-label="Open Wow Together" style="width: 28px; height: 28px; border: 1px solid #4a4133; background: #1f1c17; color: #e8e2d3; border-radius: 4px; font-size: 14px">≡</button>
    <button type="button" aria-label="Hide guide window" style="width: 28px; height: 28px; border: 1px solid #4a4133; background: #1f1c17; color: #e8e2d3; border-radius: 4px; font-size: 13px">×</button>
  </div>
  <div style="display: flex; flex-direction: column; padding: 10px 16px; gap: 2px; flex: 1">
    <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; background: #2a251d; border-radius: 4px">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#e8e2d3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Kill"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
      <span style="flex: 1; font-size: 14px; font-weight: 600">Laughing Sisters <span style="color: #b8ae9c; font-weight: 500">3/8</span></span>
      <span style="font-size: 12px; color: #b8ae9c">210 yd</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; color: #b8ae9c">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #d9b45b; color: #1f1c17; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center" role="img" aria-label="Turn in">?</span>
      <span style="flex: 1; font-size: 13px">Kil'hala</span>
      <span style="font-size: 12px">Crossroads</span>
    </div>
    <div style="display: flex; align-items: center; gap: 12px; padding: 6px 8px; color: #b8ae9c">
      <span style="width: 20px; height: 20px; border-radius: 50%; background: #d9b45b; color: #1f1c17; font-weight: 700; font-size: 14px; display: flex; align-items: center; justify-content: center" role="img" aria-label="Accept">!</span>
      <span style="flex: 1; font-size: 13px">Deino</span>
      <span style="font-size: 12px">1.2 km</span>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px 10px 16px">
    <button type="button" aria-label="Previous step" style="width: 30px; height: 28px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 14px">‹</button>
    <button type="button" style="flex: 1; height: 28px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 12px; font-weight: 500">Skip step</button>
    <button type="button" style="flex: 1; height: 28px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 12px; font-weight: 500">Skip quest</button>
    <button type="button" aria-label="Next step" style="width: 30px; height: 28px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 14px">›</button>
  </div>
</div>
</body></html>
