<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Main — Wow Together mockup</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
body{margin:0}
a{color:#d9b45b}a:hover{color:#f0d17e}
</style>
<style>body{background:#111;padding:24px}</style></head><body>

<div style="width: 460px; height: 270px; box-sizing: border-box; font-family: Inter, system-ui, sans-serif; color: #e8e2d3; background: #1f1c17; border: 1px solid #4a4133; border-radius: 6px; display: flex; flex-direction: column; overflow: hidden">
  <div style="display: flex; align-items: center; gap: 8px; padding: 8px 10px 8px 14px; background: #272319; border-bottom: 1px solid #3b3429">
    <div style="flex: 1; font-size: 12px; color: #b8ae9c">Horde / The Barrens · <span style="color: #e8e2d3; font-weight: 600">step 12 of 48</span></div>
    <button type="button" aria-label="Pause" style="width: 28px; height: 28px; border: 1px solid #4a4133; background: #1f1c17; color: #e8e2d3; border-radius: 4px; font-size: 13px">II</button>
    <button type="button" aria-label="Open Wow Together" style="width: 28px; height: 28px; border: 1px solid #4a4133; background: #1f1c17; color: #e8e2d3; border-radius: 4px; font-size: 14px">≡</button>
    <button type="button" aria-label="Hide guide window" style="width: 28px; height: 28px; border: 1px solid #4a4133; background: #1f1c17; color: #e8e2d3; border-radius: 4px; font-size: 13px">×</button>
  </div>
  <div style="display: flex; gap: 14px; padding: 16px 16px 10px 16px; flex: 1">
    <div style="width: 40px; height: 40px; border-radius: 6px; background: #2c2720; border: 1px solid #4a4133; display: flex; align-items: center; justify-content: center; flex: none">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#e8e2d3" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Kill"><path d="M14.5 17.5 3 6V3h3l11.5 11.5"/><path d="M13 19l6-6"/><path d="M16 16l4 4"/><path d="M19 21l2-2"/></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0">
      <div style="font-size: 16px; font-weight: 600; line-height: 1.25">Kill 8 Laughing Sisters <span style="color: #b8ae9c; font-weight: 500">3/8</span></div>
      <div style="font-size: 12px; color: #b8ae9c; line-height: 1.35">Required for Protect Kanati Greycloud later in this guide</div>
      <div style="font-size: 12px; line-height: 1.35"><span style="color: #d9b45b; font-weight: 600">Required</span><span style="color: #b8ae9c"> · 210 yd, ~30 s · with Bob</span></div>
    </div>
  </div>
  <div style="display: flex; align-items: center; gap: 8px; padding: 0 16px 10px 16px">
    <button type="button" aria-label="Previous step" style="width: 30px; height: 30px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 14px">‹</button>
    <button type="button" style="flex: 1; height: 30px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 12px; font-weight: 500">Skip step</button>
    <button type="button" style="flex: 1; height: 30px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 12px; font-weight: 500">Skip quest</button>
    <button type="button" aria-label="Next step" style="width: 30px; height: 30px; border: 1px solid #4a4133; background: #26211a; color: #e8e2d3; border-radius: 4px; font-size: 14px">›</button>
  </div>
  <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px; background: #231f19; border-top: 1px solid #3b3429; font-size: 12px; color: #b8ae9c">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#d9b45b" stroke-width="2" aria-hidden="true"><path d="M12 3v18M3 12h18"/></svg>
    <span style="flex: 1">Dungeon entrance nearby</span>
    <a href="#" style="font-weight: 600; text-decoration: none">Open map</a>
    <a href="#" style="color: #b8ae9c; text-decoration: none">Not now</a>
  </div>
</div>
</body></html>
