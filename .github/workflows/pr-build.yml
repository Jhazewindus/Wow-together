name: PR build
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
permissions:
  contents: read
concurrency:
  group: pr-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true
jobs:
  host-tests:
    name: Host tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest lupa -r tools/requirements-icons.txt
      - run: python tools/run_ci_tests.py --shard "${{ matrix.shard }}" --total 4
  checks:
    if: always()
    needs: host-tests
    name: PR checks
    runs-on: ubuntu-latest
    steps:
      - name: Require every test shard to pass
        env:
          TEST_RESULT: ${{ needs.host-tests.result }}
        run: test "$TEST_RESULT" = success
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate this branch's release fragment
        id: fragment
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BRANCH: ${{ github.head_ref }}
        run: python tools/ci_release.py validate-pr --root . --base "$BASE_SHA" --head "$HEAD_SHA" --branch "$BRANCH"
      - name: Resolve next beta version
        id: version
        run: echo "version=$(python tools/ci_release.py next-version --root .)" >> "$GITHUB_OUTPUT"
      - run: python -m pip install pytest lupa -r tools/requirements-icons.txt
      - run: python tools/syntax_check.py
      - run: python tools/build_icons.py --check
      - run: python tools/boundary_check.py
      - name: Build beta archive
        env:
          BRANCH: ${{ github.head_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          NEXT_VERSION: ${{ steps.version.outputs.version }}
          RELEASE_NAME: ${{ steps.fragment.outputs.release_name }}
          FRAGMENT: ${{ steps.fragment.outputs.fragment }}
        run: python tools/build_release.py --output dist/ --label "$BRANCH" --sha "$HEAD_SHA" --version "$NEXT_VERSION-beta.$PR_NUMBER.$HEAD_SHA" --release-name "$RELEASE_NAME" --notes-file "$FRAGMENT"
      - uses: actions/upload-artifact@v4
        with:
          name: beta-build
          path: dist/
          retention-days: 14
          if-no-files-found: error
