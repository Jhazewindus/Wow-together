name: Release
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: release-main
  cancel-in-progress: false
jobs:
  host-tests:
    name: Host tests (${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest lupa -r tools/requirements-icons.txt
      - run: python tools/run_ci_tests.py --shard "${{ matrix.shard }}" --total 4
  release:
    needs: host-tests
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.plan.outputs.release }}
      version: ${{ steps.plan.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest lupa -r tools/requirements-icons.txt
      - name: Collect fragments since the last release tag
        id: plan
        run: python tools/ci_release.py plan --root . --notes dist/release-notes.md
      - name: Validate the Discord destination
        if: steps.plan.outputs.release == 'true'
        env:
          CI_DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          python - <<'PYCODE'
          import os, sys
          sys.path.insert(0, 'tools')
          from post_discord_release import webhook_endpoint
          value = os.environ.get('CI_DISCORD_WEBHOOK')
          if not value:
              raise SystemExit('Configure DISCORD_RELEASE_WEBHOOK before releasing')
          webhook_endpoint(value)
          PYCODE
      - name: Validate, build, tag, and publish release
        if: steps.plan.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.plan.outputs.version }}
          RELEASE_NAME: ${{ steps.plan.outputs.release_name }}
          CI_DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
        run: |
          python tools/syntax_check.py
          python tools/build_icons.py --check
          python tools/boundary_check.py
          python tools/build_release.py --output dist/ --version "$VERSION" --release-name "$RELEASE_NAME" --notes-file dist/release-notes.md
          python tools/ci_release.py post --kind release --dist dist/ --dry-run
          gh release create "v$VERSION" dist/*.zip --target "$GITHUB_SHA" --title "Wow Together $VERSION — $RELEASE_NAME" --notes-file dist/release-notes.md
          python tools/ci_release.py post --kind release --dist dist/
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: release-record
          path: dist/
          retention-days: 14
          if-no-files-found: ignore
